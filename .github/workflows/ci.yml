name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  BUN_VERSION: '1.4.2'

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run type-check
      # Runs the conformance suite in process and against a freshly compiled executable,
      # using the fake qwen fixture: no LLM or Qwen Code install needed.
      - run: bun test
